[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-lead-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
  "python-dateutil>=2.9,<3",
  "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
social = ["playwright>=1.55,<2", "instaloader>=4.14,<5"]
geography = ["shapely>=2,<3"]
# Server deployments (AWS trial): exact pins, installed from requirements-server.lock with hashes.
server = ["playwright==1.63.0", "boto3==1.43.116"]

[tool.setuptools.packages.find]
include = ["leadworkbench*"]

[tool.setuptools.package-data]
leadworkbench = ["datasets/*.json.gz", "datasets/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
